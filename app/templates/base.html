<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Docusrv{% endblock %}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#667085; --accent:#2563eb; --ok:#15803d; --err:#b91c1c; --line:#e4e7ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --card:#1b1f27; --fg:#e6e9ef; --muted:#98a2b3; --accent:#60a5fa; --ok:#4ade80; --err:#f87171; --line:#2a303b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:720px; margin:48px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:24px; margin-bottom:20px; }
  h1 { font-size:1.5rem; margin:0 0 4px; } h2 { font-size:1.1rem; margin:0 0 12px; }
  p.muted, .muted { color:var(--muted); }
  .flash { padding:10px 14px; border-radius:8px; margin-bottom:16px; border:1px solid; }
  .flash.ok { color:var(--ok); border-color:var(--ok); } .flash.error { color:var(--err); border-color:var(--err); }
  button, .btn { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 16px; font:inherit; cursor:pointer; text-decoration:none; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); padding:4px 10px; font-size:.9rem; }
  input[type=file] { margin:8px 0 16px; max-width:100%; }
  table { width:100%; border-collapse:collapse; } td { padding:8px 0; border-top:1px solid var(--line); }
  td:last-child { text-align:right; }
  #drop-overlay { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    background:color-mix(in srgb, var(--bg) 85%, transparent); pointer-events:none; }
  #drop-overlay[hidden] { display:none; }
  #drop-overlay div { border:3px dashed var(--accent); border-radius:16px; padding:48px 32px; margin:16px;
    font-size:1.25rem; color:var(--accent); background:var(--card); text-align:center; }
  .filename { font-size:.9rem; word-break:break-all; }
  .badge { font-size:.8rem; color:var(--ok); border:1px solid var(--ok); border-radius:99px; padding:1px 8px; }
</style>
</head>
<body><main>{% block content %}{% endblock %}</main></body>
</html>
